name: Real build workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workflows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Real offline npm and Cargo workflows
        run: make workflow-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-workflows-${{ runner.os }}
          path: dist/workflow-*
          if-no-files-found: error

  pinned-projects:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        project: [clsx, ripgrep]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.workflow-npm-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      # The pinned clsx tests use the legacy esm loader and need Node 18.
      - uses: actions/setup-node@v7
        with:
          node-version: '18.20.8'
          package-manager-cache: false
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Build Cambium
        run: make build
      - name: Prepare pinned upstream source and dependency caches
        run: |
          mkdir -p dist
          python3 scripts/prepare-workflow-project.py \
            --project "${{ matrix.project }}" \
            --destination "$RUNNER_TEMP/cambium-${{ matrix.project }}-source" \
            --recipe "$RUNNER_TEMP/cambium-${{ matrix.project }}-recipe.json"
      - name: Build, edit, rebuild, remove, and prune five worktrees
        run: |
          methods=git-env-copy,cambium-auto
          if [ "$RUNNER_OS" = macOS ]; then
            methods=git-env-copy,cambium-auto,cambium-cow
          fi
          python3 scripts/workflow-benchmark.py \
            --recipe "$RUNNER_TEMP/cambium-${{ matrix.project }}-recipe.json" \
            --count 5 --methods "$methods" \
            --cambium-bin "$PWD/bin/cambium" \
            --output "dist/workflow-${{ matrix.project }}-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-workflow-${{ matrix.project }}-${{ runner.os }}
          path: dist/workflow-*
          if-no-files-found: error
