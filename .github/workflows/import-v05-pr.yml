name: Publish validated Cambium v0.5 source

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/publish-v05-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Download validated source payload from issue 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/2/comments?per_page=100" \
            --jq '[.[] | select(.body | startswith("PART")) | .body] | last' \
            | sed 's/^PART[0-9][0-9]://' > /tmp/cambium-v05.b64
          test -s /tmp/cambium-v05.b64
          base64 --decode /tmp/cambium-v05.b64 > /tmp/cambium-v05.tar.gz
          gzip -t /tmp/cambium-v05.tar.gz
          mkdir -p /tmp/cambium-v05
          tar -xzf /tmp/cambium-v05.tar.gz -C /tmp/cambium-v05
          SRC="$(find /tmp/cambium-v05 -name go.mod -printf '%h\n' | head -1)"
          test -n "$SRC"
          test -d "$SRC/cmd/cambium"
          test -d "$SRC/internal"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Validate source
        run: |
          set -euo pipefail
          cd "$SRC"
          test -f README.md
          test -f COMPARISONS.md
          test -f docs/PLAN.md
          test -f docs/ARCHITECTURE.md
          make check
          make test-race
          make system-test
          git diff --check

      - name: Replace bootstrap repository with source
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$SRC/" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'Nicholas Bardy'
          git config user.email 'nicholasbardy@gmail.com'
          git add -A
          git commit -m 'Release Cambium v0.5.0'
          git tag -f v0.5.0
          git push origin HEAD:main
          git push origin refs/tags/v0.5.0 --force
