name: Import Cambium v0.5 source

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  import-source:
    if: github.event.issue.title == 'IMPORT_CAMBIUM_V05' && github.event.comment.body == 'RUN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble source from issue comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, tarfile, urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          issue = os.environ['ISSUE']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as r:
              comments = json.load(r)
          parts = {}
          for c in comments:
              body = c.get('body') or ''
              if body.startswith('PART') and ':' in body:
                  label, payload = body.split(':', 1)
                  if len(label) == 6 and label[4:].isdigit():
                      parts[int(label[4:])] = ''.join(payload.split())
          if not parts:
              raise SystemExit('no source parts found')
          expected = list(range(max(parts) + 1))
          if sorted(parts) != expected:
              raise SystemExit(f'missing source parts: have {sorted(parts)}, expected {expected}')
          data = base64.b64decode(''.join(parts[i] for i in expected), validate=True)
          archive = Path('/tmp/cambium-v05.tar.gz')
          archive.write_bytes(data)
          out = Path('/tmp/cambium-v05')
          out.mkdir()
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(out, filter='data')
          roots = [p.parent for p in out.rglob('go.mod') if (p.parent/'cmd').is_dir() and (p.parent/'internal').is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'expected one source root, found {roots}')
          Path('/tmp/cambium-root').write_text(str(roots[0]))
          print('source root:', roots[0])
          PY

      - name: Validate source
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/cambium-root)"
          cd "$SRC"
          test -f README.md
          test -f COMPARISONS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/PLAN.md
          gofmt -w $(find . -name '*.go' -type f)
          go test ./...
          go test -race ./...
          go build ./cmd/cambium
          go build ./cmd/git-cambium

      - name: Publish real source tree
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/cambium-root)"
          rsync -a --delete --exclude='.git/' "$SRC/" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'Cambium Source Import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release Cambium v0.5.0 source tree'
          git push origin HEAD:main
