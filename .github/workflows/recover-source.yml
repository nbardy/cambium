name: Recover original Cambium source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-source.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: cambium-source-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Recover the exact original archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, io, json, os, re, subprocess, tarfile, urllib.request
          from pathlib import Path

          expected = '5b394f2b333e1aed5532ed21a06fa6492fa28236b4def18e4510ef8c9aa5f362'
          parts = {}
          for page in range(1, 101):
              url = f'https://api.github.com/repos/{os.environ["GH_REPO"]}/issues/2/comments?per_page=100&page={page}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              for comment in comments:
                  match = re.fullmatch(r'PART(\d+):\s*([A-Za-z0-9+/=\s]+)', comment.get('body') or '')
                  if match:
                      index = int(match.group(1))
                      payload = ''.join(match.group(2).split())
                      if index in parts and parts[index] != payload:
                          raise SystemExit(f'Conflicting archive part {index}')
                      parts[index] = payload
              if len(comments) < 100:
                  break
          if not parts or sorted(parts) != list(range(max(parts) + 1)):
              raise SystemExit('Missing archive parts; refusing to publish')
          archive = base64.b64decode(''.join(parts[i] for i in sorted(parts)), validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          print('Archive SHA-256:', actual)
          if actual != expected:
              raise SystemExit('Archive does not match the recovered August 18 release; refusing to publish')
          out = Path(os.environ['RUNNER_TEMP']) / 'cambium-original-source'
          out.mkdir()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as source:
              source.extractall(out, filter='data')
          roots = [p.parent for p in out.rglob('go.mod') if (p.parent / 'cmd').is_dir() and (p.parent / 'internal').is_dir()]
          if len(roots) != 1:
              raise SystemExit('Expected exactly one Cambium source root')
          root = roots[0]
          subprocess.run(['git', 'init', '-q', str(root)], check=True)
          subprocess.run(['git', '-C', str(root), 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', '-C', str(root), 'write-tree'], text=True).strip()
          if tree != '83c8e37b4623cf9b2491cdceffc16c1e0b186161':
              raise SystemExit(f'Original Git tree mismatch: {tree}')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'CAMBIUM_SOURCE={root}\n')
          print('Verified original v0.5 source tree:', tree)
          PY
      - name: Validate recovered code
        run: |
          set -euo pipefail
          cd "$CAMBIUM_SOURCE"
          make check
          make test-race
          make system-test
      - name: Commit normal source files without rewriting history
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          source = Path(os.environ['CAMBIUM_SOURCE'])
          destination = Path(os.environ['GITHUB_WORKSPACE'])
          paths = subprocess.check_output(['git', '-C', str(source), 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, paths):
              # Workflow restoration is handled separately by the connected
              # repository editor; the Actions token only publishes source.
              if name.startswith('.github/workflows/'):
                  continue
              src, dst = source / name, destination / name
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst, follow_symlinks=False)
          bootstrap = destination / 'bootstrap'
          if bootstrap.is_dir():
              shutil.rmtree(bootstrap)
          for name in ['.cambium-write-test', '.github/PUBLISH_V05']:
              (destination / name).unlink(missing_ok=True)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore original Cambium v0.5 Go source, tests, and documentation' -m 'Recovered from the August 18, 2026 source archive. SHA-256: 5b394f2b333e1aed5532ed21a06fa6492fa28236b4def18e4510ef8c9aa5f362. Original source tree: 83c8e37b4623cf9b2491cdceffc16c1e0b186161. Validated with make check, make test-race, and make system-test. Removes bootstrap fragments; preserves existing Git history and DESIGN.md.'
          git push origin HEAD:main
          git rev-parse HEAD
